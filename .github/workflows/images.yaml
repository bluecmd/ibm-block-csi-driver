name: Images

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # linux/arm64 is added once ARM64 support lands (see README "Planned").
  PLATFORMS: linux/amd64

jobs:
  build:
    name: ${{ matrix.image.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: controller
            dockerfile: Dockerfile-csi-controller
            repository: ibm-block-csi-driver-controller
          - name: node
            dockerfile: Dockerfile-csi-node
            repository: ibm-block-csi-driver-node
          - name: host-definer
            dockerfile: Dockerfile-csi-host-definer
            repository: ibm-block-csi-host-definer
          - name: node-windows
            dockerfile: Dockerfile-csi-node-windows
            repository: ibm-block-csi-driver-node-windows
            platforms: windows/amd64
            # Layers restored from the GHA cache lose the Files/ and Hives/
            # structure Windows layers need and fail to import on the node
            # with "The configuration registry database is corrupt".
            nocache: true
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=ref,event=tag
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          platforms: ${{ matrix.image.platforms || env.PLATFORMS }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            BUILD_NUMBER=${{ github.run_number }}
          cache-from: ${{ !matrix.image.nocache && format('type=gha,scope={0}', matrix.image.name) || '' }}
          cache-to: ${{ !matrix.image.nocache && format('type=gha,scope={0},mode=max', matrix.image.name) || '' }}
